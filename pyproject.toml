[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smo-sst-experiments"
version = "0.1.0"
description = "Reproducible particle SMO-SST experiments for the CDC manuscript"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "matplotlib>=3.8", "pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
smo-sst = "smo_sst.cli:main"

[tool.setuptools.package-data]
smo_sst = ["native.cpp"]

[tool.setuptools.packages.find]
include = ["smo_sst*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
